<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#0b0d12;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#e8ebf2;position:relative;}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(120px);opacity:.28;}
  .g1{background:#5c7bff;left:-300px;top:-420px;}
  .g2{background:#ff538d;right:-350px;bottom:-500px;}
  .bar{position:absolute;left:0;top:0;width:1200px;height:10px;background:linear-gradient(90deg,#5c7bff,#7d6cff 60%,#ff538d);}
  .wrap{position:absolute;left:96px;top:96px;right:96px;bottom:84px;}
  .logo{width:420px;height:auto;display:block;}
  .title{font-size:86px;font-weight:800;letter-spacing:2px;margin-top:54px;line-height:1.1;color:#fff;}
  .sub{font-size:34px;color:#aab2c5;margin-top:22px;letter-spacing:1px;}
  .url{position:absolute;left:0;bottom:0;display:inline-block;padding:16px 30px;border-radius:18px;border:2px solid rgba(92,123,255,.6);background:rgba(92,123,255,.14);font-size:36px;font-weight:700;color:#c6d2ff;letter-spacing:.5px;}
  .tag{position:absolute;right:0;bottom:8px;font-size:26px;color:#8b93a7;}
</style></head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="bar"></div>
  <div class="wrap">
    <img class="logo" src="logo.svg" alt="">
    <div class="title">官方发布页 · 请收藏</div>
    <div class="sub">域名失效时来这里找新地址 · 最新地址每天自动更新</div>
    <div class="url">xiaolanweb.github.io</div>
    <div class="tag">小蓝web 官方唯一发布页</div>
  </div>
</body></html>
